# Render Blueprint — https://render.com/docs/blueprint-spec
#
# One web service running the Next.js app (pages and API routes together;
# there is no separate backend), plus a persistent disk for the SQLite
# database and admin-uploaded images — without it both live on Render's
# ephemeral filesystem and get wiped on every deploy/idle spin-down.
services:
  - type: web
    name: aed-readiness-campaign
    runtime: node
    plan: starter
    # Closest region to the hotels being audited.
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24"
      # Points the database and /uploads at the mounted volume below
      # instead of the project directory — see lib/dataDir.js.
      - key: AED_DATA_DIR
        value: /var/data
      # Set these in the Render dashboard — never committed.
      - key: ADMIN_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
    disk:
      name: aed-data
      mountPath: /var/data
      sizeGB: 1
